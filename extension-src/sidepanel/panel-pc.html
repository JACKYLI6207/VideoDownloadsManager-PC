<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Downloads Manager</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="pc-mode">
  <div class="app-shell">
    <header class="app-header">
      <h1>⬇ Video Downloads Manager</h1>
      <button class="btn-popout" id="openBatchSearch" type="button" title="在新分頁開啟批量搜索（可選 TXT 列表）">批量搜索 ↗</button>
    </header>

    <div id="toast" class="toast" hidden></div>

    <section id="panel-detected" class="panel active">
      <div class="toolbar">
        <label><input type="checkbox" id="selectAll" /> 全選</label>
        <span id="detectedCount">0 個</span>
      </div>
      <p id="sourceTabLabel" class="source-tab-label" hidden></p>
      <div id="detectedList" class="list"></div>
      <div id="detectedEmpty" class="empty" style="display:none">
        <strong>尚未偵測到可下載影片</strong><br />
        ① 切到正在<strong>播放影片</strong>的分頁<br />
        ② 點下方「<strong>重新偵測</strong>」或按 F5<br />
        ③ 播放影片後等 2 秒再看<br /><br />
        <button class="btn primary" id="reinjectBtn" type="button" style="font-size:12px;padding:6px 14px;">↺ 重新偵測當前分頁</button>
      </div>
      <div class="footer" id="downloadFooter" style="display:none">
        <button class="btn primary" id="downloadBtn">添加至可下載清單</button>
        <button class="btn group-dl" id="groupDownloadBtn" hidden>群組添加至可下載清單</button>
        <button class="btn cover-dl" id="coverDownloadBtn">下載封面</button>
        <button class="btn cover-dl" id="groupCoverDownloadBtn" hidden>群組下載封面</button>
      </div>
    </section>
  </div>
  <script src="panel-pc.js"></script>
</body>
</html>
